
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZSEPA | User Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">
      <div class="brand-logo">♻</div>
      <h1>ZSEPA</h1>
      <p>Zamfara State Environmental Protection Agency</p>
      <small>Smart Waste Collection Management System</small>
    </div>

    <h2>User Login</h2>
    <p class="muted">Welcome back. Sign in to your account.</p>

    <form id="userLoginForm">
      <label>Email Address</label>
      <input type="email" id="userEmail" placeholder="Enter your email" required>

      <label>Password</label>
      <input type="password" id="userPassword" placeholder="Enter your password" required>

      <button class="btn primary full" type="submit">Login as User</button>
    </form>

    <p class="center"><a href="#" id="forgotLink">Forgot Password?</a></p>
    <p class="center">Don't have an account? <a href="register.html">Create Account</a></p>

    <div class="admin-link">
      <p>Are you an administrator?</p>
      <a href="admin.html">Administrator Login →</a>
    </div>

    <p id="authMessage" class="message"></p>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
