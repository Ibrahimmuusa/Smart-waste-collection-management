
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZSEPA | Administrator Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">
      <div class="brand-logo">♻</div>
      <h1>ZSEPA</h1>
      <p>Administration Portal</p>
      <small>Authorized Personnel Only</small>
    </div>

    <div class="admin-heading">Administrator Access</div>

    <form id="adminLoginForm">
      <label>Administrator Email</label>
      <input type="email" id="adminEmail" placeholder="Enter admin email" required>

      <label>Password</label>
      <input type="password" id="adminPassword" placeholder="Enter password" required>

      <button class="btn dark full" type="submit">Access Admin Dashboard</button>
    </form>

    <p class="center"><a href="index.html">← Back to User Login</a></p>
    <p id="adminMessage" class="message"></p>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
